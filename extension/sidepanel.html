<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>site-modder</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <button id="agent" class="agent-btn" type="button" aria-expanded="false" aria-controls="account" hidden></button>
      <div class="actions">
        <button id="stop" hidden title="Stop the agent">Stop</button>
        <button id="new" title="Start a new conversation">New chat</button>
      </div>
    </header>
    <section id="account" class="account" hidden></section>
    <div id="banners"></div>
    <section id="agents" class="signin" hidden></section>
    <section id="signin" class="signin" hidden></section>
    <main id="log"></main>
    <form id="composer">
      <div id="page" class="page"></div>
      <textarea id="input" rows="3" placeholder="Describe a change to this page…"></textarea>
      <div class="composer-row">
        <select id="model" aria-label="Model" hidden></select>
        <button id="send" type="submit">Send</button>
      </div>
    </form>
    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
