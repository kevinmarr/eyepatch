<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>site-modder</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <div id="agent" class="agent-name" hidden></div>
      <div class="actions">
        <button id="stop" hidden title="Stop the agent">Stop</button>
        <div id="new-wrap" class="split">
          <button id="new" type="button">New chat</button>
          <button id="new-menu-btn" type="button" aria-label="New chat with another agent" title="New chat with another agent" aria-haspopup="menu" aria-expanded="false" aria-controls="new-menu"></button>
          <div id="new-menu" class="menu" role="menu" hidden></div>
        </div>
        <div class="more-wrap">
          <button id="more" type="button" class="icon" aria-label="More" title="More" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu">
            <i data-icon="ellipsis-vertical"></i>
          </button>
          <div id="more-menu" class="menu more-menu" role="menu" hidden></div>
        </div>
      </div>
    </header>
    <div id="banners"></div>
    <section id="setup" class="setup" hidden>
      <p>Choose a coding agent to get started.</p>
      <button id="setup-open" type="button" class="primary">Open setup</button>
    </section>
    <main id="log"></main>
    <form id="composer">
      <div id="page" class="page"></div>
      <textarea id="input" rows="3" placeholder="Describe a change to this page…"></textarea>
      <div class="composer-row">
        <select id="model" aria-label="Model" hidden></select>
        <button id="send" type="submit">Send</button>
      </div>
    </form>
    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
