<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>site-modder</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1><img src="icons/icon48.png" alt="" />site-modder</h1>

      <section>
        <h2>Setup</h2>
        <ul id="setup" class="rows"></ul>
      </section>

      <section id="agents-section">
        <h2>Agents</h2>
        <ul id="installed" class="rows"></ul>
        <div id="add-status"></div>
        <div id="add" class="add">
          <button id="add-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="add-menu">
            <i data-icon="plus"></i>
            <span>Add</span>
          </button>
          <div id="add-menu" class="menu" role="menu" hidden></div>
        </div>
      </section>

      <section id="mods-section" hidden>
        <h2>Mods</h2>
        <div id="mods"></div>
      </section>
    </main>
    <script src="options.js" type="module"></script>
  </body>
</html>
